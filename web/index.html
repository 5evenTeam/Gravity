<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gravity Chess</title>
    <link rel="icon" type="image/png" href="logo.png">
    <script src="chess.min.js"></script>
    <style>
        :root {
            --bg-page: #161512;
            --bg-panel: #21201d;
            --bg-subtle: #262421;
            --border-color: #363431;
            --text-main: #bababa;
            --text-bright: #ffffff;
            --text-muted: #787673;

            /* Lichess Standard Board Colors */
            --sq-light: #f0d9b5;
            --sq-dark: #b58863;
            --sq-selected: #829769;
            --sq-last-move: rgba(205, 210, 106, 0.6);
            --sq-check: rgba(235, 97, 80, 0.85);

            --accent: #3692e7;
            --btn-bg: #2b2926;
            --btn-hover: #363430;
        }

        body.theme-ocean {
            --sq-light: #dee3e6;
            --sq-dark: #8ca2ad;
            --sq-selected: #647b87;
        }

        body.theme-green {
            --sq-light: #ffffdd;
            --sq-dark: #86a666;
            --sq-selected: #baca44;
        }

        body.theme-slate {
            --sq-light: #e0e0e0;
            --sq-dark: #4d5c68;
            --sq-selected: #7b8d9c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-page);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: var(--bg-panel);
            border-bottom: 1px solid var(--border-color);
            padding: 8px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-logo {
            width: 28px;
            height: 28px;
            border-radius: 4px;
            object-fit: cover;
        }

        .brand h1 {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-bright);
            letter-spacing: 0.2px;
        }

        .header-tools {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
        }

        select {
            background: var(--btn-bg);
            color: var(--text-bright);
            border: 1px solid var(--border-color);
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 12px;
            outline: none;
            cursor: pointer;
        }

        .status-tag {
            font-size: 12px;
            color: var(--text-muted);
        }

        .main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px;
            gap: 24px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        .board-col {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .player-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 12px;
            background: var(--bg-panel);
            border-radius: 4px;
            border: 1px solid var(--border-color);
            font-size: 13px;
        }

        .player-name {
            font-weight: 600;
            color: var(--text-bright);
        }

        .captured-container {
            display: flex;
            align-items: center;
            gap: 1px;
            height: 18px;
            margin-top: 2px;
        }

        .captured-img {
            width: 16px;
            height: 16px;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
        }

        .mat-diff {
            font-size: 11px;
            font-weight: 600;
            color: var(--accent);
            margin-left: 4px;
        }

        .clock {
            font-family: monospace;
            font-size: 16px;
            font-weight: 700;
            padding: 4px 10px;
            background: #111;
            border-radius: 3px;
            color: var(--text-bright);
            min-width: 65px;
            text-align: center;
        }

        .clock.active {
            background: #2b3b4f;
            color: #62b0ff;
        }

        .clock.low {
            color: #ff5555;
        }

        .board-frame {
            display: flex;
            align-items: stretch;
            gap: 8px;
        }

        .eval-bar {
            width: 22px;
            background: #333;
            border-radius: 2px;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            border: 1px solid var(--border-color);
        }

        .eval-fill {
            width: 100%;
            height: 50%;
            background: #eee;
            transition: height 0.3s ease;
        }

        .eval-label {
            position: absolute;
            width: 100%;
            text-align: center;
            font-family: monospace;
            font-size: 9px;
            font-weight: 700;
            z-index: 2;
        }

        .eval-label.top { top: 2px; color: #111; }
        .eval-label.bottom { bottom: 2px; color: #fff; }

        .board-relative {
            position: relative;
            width: 560px;
            height: 560px;
        }

        .board {
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            border-radius: 3px;
            overflow: hidden;
            border: 1px solid #111;
            touch-action: none;
        }

        .arrow-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        .square {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: pointer;
        }

        .square.light { background: var(--sq-light); }
        .square.dark { background: var(--sq-dark); }
        .square.selected { background: var(--sq-selected) !important; }
        .square.last-move { background: var(--sq-last-move) !important; }
        .square.check { background: var(--sq-check) !important; }

        .coord {
            position: absolute;
            font-size: 10px;
            font-weight: 600;
            pointer-events: none;
            opacity: 0.75;
        }

        .coord.rank { left: 2px; top: 1px; }
        .coord.file { right: 2px; bottom: 1px; }
        .square.light .coord { color: var(--sq-dark); }
        .square.dark .coord { color: var(--sq-light); }

        .piece {
            width: 100%;
            height: 100%;
            cursor: grab;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            z-index: 5;
        }

        .piece:active { cursor: grabbing; }

        .drag-follower {
            position: fixed;
            width: 70px;
            height: 70px;
            pointer-events: none;
            z-index: 1000;
            transform: translate(-50%, -50%);
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            display: none;
        }

        .hint-dot {
            width: 18px;
            height: 18px;
            background: rgba(0, 0, 0, 0.25);
            border-radius: 50%;
            pointer-events: none;
            z-index: 4;
        }

        .hint-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 5px solid rgba(0, 0, 0, 0.3);
            border-radius: 50%;
            pointer-events: none;
            z-index: 4;
        }

        .side-col {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 14px;
            max-width: 420px;
        }

        .panel {
            background: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 14px;
        }

        .panel-header {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .opening-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-bright);
        }

        .opening-sub {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .data-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin: 12px 0;
        }

        .data-cell {
            background: var(--bg-subtle);
            border: 1px solid var(--border-color);
            padding: 6px 10px;
            border-radius: 3px;
        }

        .data-label {
            font-size: 10px;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .data-val {
            font-family: monospace;
            font-size: 13px;
            font-weight: 700;
            color: var(--text-bright);
            margin-top: 2px;
        }

        .pv-box {
            background: var(--bg-subtle);
            border: 1px solid var(--border-color);
            border-radius: 3px;
            padding: 8px;
            font-family: monospace;
            font-size: 11px;
            color: #8bb2d6;
            margin-bottom: 12px;
            min-height: 32px;
            word-break: break-all;
        }

        .slider-row {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            margin-bottom: 4px;
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--accent);
            cursor: pointer;
            margin-bottom: 12px;
        }

        .btn-group {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 6px;
            margin-bottom: 6px;
        }

        .btn-row {
            display: flex;
            gap: 6px;
        }

        button {
            background: var(--btn-bg);
            color: var(--text-bright);
            border: 1px solid var(--border-color);
            padding: 7px 10px;
            border-radius: 3px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            flex: 1;
            text-align: center;
        }

        button:hover { background: var(--btn-hover); }

        button.btn-primary {
            background: #2b496e;
            border-color: #3f689c;
        }

        button.btn-primary:hover { background: #355b8a; }

        .moves-table-wrap {
            height: 180px;
            overflow-y: auto;
            background: var(--bg-subtle);
            border: 1px solid var(--border-color);
            border-radius: 3px;
            font-family: monospace;
            font-size: 12px;
        }

        .moves-table {
            width: 100%;
            border-collapse: collapse;
        }

        .moves-table tr:nth-child(even) { background: rgba(255, 255, 255, 0.02); }

        .moves-table td {
            padding: 4px 8px;
        }

        .moves-table td.col-num {
            width: 32px;
            color: var(--text-muted);
            text-align: right;
            border-right: 1px solid var(--border-color);
        }

        .moves-table td.col-move {
            width: 45%;
            color: var(--text-bright);
            cursor: pointer;
        }

        .moves-table td.col-move:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        /* Modal */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.65);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }

        .modal-body {
            background: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 20px;
            min-width: 300px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .modal-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-bright);
        }

        .promo-list {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .promo-item {
            width: 60px;
            height: 60px;
            background: var(--bg-subtle);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            cursor: pointer;
            background-size: 85%;
            background-position: center;
            background-repeat: no-repeat;
        }

        .promo-item:hover { background: var(--btn-hover); }

        input.text-input {
            width: 100%;
            background: var(--bg-subtle);
            border: 1px solid var(--border-color);
            color: var(--text-bright);
            padding: 8px 10px;
            font-family: monospace;
            font-size: 12px;
            border-radius: 3px;
            outline: none;
        }

        @media (max-width: 1050px) {
            .main { flex-direction: column; align-items: center; }
            .board-relative, .board { width: 90vw; height: 90vw; max-width: 520px; max-height: 520px; }
            .side-col { width: 100%; max-width: 520px; }
        }
    </style>
</head>
<body>

<header>
    <div class="brand">
        <img class="brand-logo" src="logo.png" alt="Gravity Logo">
        <h1>Gravity</h1>
    </div>

    <div class="header-tools">
        <select id="timeControlSelect">
            <option value="none">Casual</option>
            <option value="60+1">Bullet 1+1</option>
            <option value="180+2">Blitz 3+2</option>
            <option value="300+0" selected>Blitz 5m</option>
            <option value="600+5">Rapid 10+5</option>
        </select>

        <select id="themeSelect">
            <option value="default">Wood</option>
            <option value="theme-ocean">Ocean</option>
            <option value="theme-green">Green</option>
            <option value="theme-slate">Slate</option>
        </select>

        <span class="status-tag" id="engineStatusText">Stockfish 19 / Gravity</span>
    </div>
</header>

<div class="main">
    <div class="board-col">
        <!-- Top Player -->
        <div class="player-row">
            <div>
                <span class="player-name" id="topPlayerName">Engine (Black)</span>
                <div class="captured-container" id="topCaptured"></div>
            </div>
            <div class="clock" id="topClock">05:00</div>
        </div>

        <div class="board-frame">
            <div class="eval-bar">
                <div class="eval-label top" id="evalTop"></div>
                <div class="eval-fill" id="evalFill"></div>
                <div class="eval-label bottom" id="evalBottom">+0.0</div>
            </div>

            <div class="board-relative">
                <div class="board" id="board"></div>
                <svg class="arrow-svg" id="arrowSvg" viewBox="0 0 560 560">
                    <defs>
                        <marker id="arrow" markerWidth="6" markerHeight="6" refX="4" refY="3" orient="auto">
                            <polygon points="0 0, 6 3, 0 6" fill="rgba(60, 140, 220, 0.8)" />
                        </marker>
                    </defs>
                    <line id="moveArrow" x1="0" y1="0" x2="0" y2="0" stroke="rgba(60, 140, 220, 0.8)" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)" style="display:none;" />
                </svg>
            </div>
        </div>

        <!-- Bottom Player -->
        <div class="player-row">
            <div>
                <span class="player-name" id="bottomPlayerName">Player (White)</span>
                <div class="captured-container" id="bottomCaptured"></div>
            </div>
            <div class="clock active" id="bottomClock">05:00</div>
        </div>
    </div>

    <div class="drag-follower" id="dragFollower"></div>

    <div class="side-col">
        <div class="panel">
            <div class="panel-header">Opening</div>
            <div class="opening-title" id="openingTitle">Starting Position</div>
            <div class="opening-sub" id="openingSub">ECO A00</div>

            <div class="data-grid">
                <div class="data-cell">
                    <div class="data-label">Depth</div>
                    <div class="data-val" id="statDepth">-</div>
                </div>
                <div class="data-cell">
                    <div class="data-label">Speed</div>
                    <div class="data-val" id="statNps">-</div>
                </div>
                <div class="data-cell">
                    <div class="data-label">Evaluation</div>
                    <div class="data-val" id="statEval">0.00</div>
                </div>
                <div class="data-cell">
                    <div class="data-label">Source</div>
                    <div class="data-val" id="statSource" style="font-size:11px;">Gravity</div>
                </div>
            </div>

            <div class="pv-box" id="statPv">Ready</div>

            <div class="slider-row">
                <span>Strength (ELO)</span>
                <span id="eloLabel" style="font-family:monospace; font-weight:700;">4000</span>
            </div>
            <input type="range" id="eloSlider" min="800" max="4000" step="50" value="4000">

            <div class="btn-group">
                <button class="btn-primary" id="btnNew">New Game</button>
                <button id="btnFlip">Flip</button>
                <button id="btnUndo">Undo</button>
                <button id="btnSelf">Auto Play</button>
            </div>

            <div class="btn-row">
                <button id="btnPgn">PGN</button>
                <button id="btnFen">Copy FEN</button>
                <button id="btnLoad">Load FEN</button>
                <button id="btnHint">Hint</button>
            </div>
        </div>

        <div class="panel">
            <div class="panel-header">Moves</div>
            <div class="moves-table-wrap" id="movesWrap">
                <table class="moves-table">
                    <tbody id="movesBody"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- Promotion Dialog -->
<div class="modal" id="promoModal">
    <div class="modal-body">
        <div class="modal-title">Promote Pawn</div>
        <div class="promo-list" id="promoList"></div>
    </div>
</div>

<!-- FEN Dialog -->
<div class="modal" id="fenModal">
    <div class="modal-body">
        <div class="modal-title">Load FEN</div>
        <input type="text" class="text-input" id="fenText" placeholder="rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1">
        <div class="btn-row">
            <button class="btn-primary" id="btnApplyFen">Load</button>
            <button onclick="document.getElementById('fenModal').style.display='none'">Cancel</button>
        </div>
    </div>
</div>

<!-- Game Over Dialog -->
<div class="modal" id="gameoverModal">
    <div class="modal-body" style="text-align: center;">
        <div class="modal-title" id="goTitle">Game Over</div>
        <div id="goDesc" style="font-size: 13px; color: var(--text-muted); margin-bottom: 8px;"></div>
        <button class="btn-primary" id="btnRestart">New Game</button>
    </div>
</div>

<script>
const PIECES = {
    'w': {
        'p': 'https://upload.wikimedia.org/wikipedia/commons/4/45/Chess_plt45.svg',
        'n': 'https://upload.wikimedia.org/wikipedia/commons/7/70/Chess_nlt45.svg',
        'b': 'https://upload.wikimedia.org/wikipedia/commons/b/b1/Chess_blt45.svg',
        'r': 'https://upload.wikimedia.org/wikipedia/commons/7/72/Chess_rlt45.svg',
        'q': 'https://upload.wikimedia.org/wikipedia/commons/1/15/Chess_qlt45.svg',
        'k': 'https://upload.wikimedia.org/wikipedia/commons/4/42/Chess_klt45.svg'
    },
    'b': {
        'p': 'https://upload.wikimedia.org/wikipedia/commons/c/c7/Chess_pdt45.svg',
        'n': 'https://upload.wikimedia.org/wikipedia/commons/e/ef/Chess_ndt45.svg',
        'b': 'https://upload.wikimedia.org/wikipedia/commons/9/98/Chess_bdt45.svg',
        'r': 'https://upload.wikimedia.org/wikipedia/commons/f/ff/Chess_rdt45.svg',
        'q': 'https://upload.wikimedia.org/wikipedia/commons/4/47/Chess_qdt45.svg',
        'k': 'https://upload.wikimedia.org/wikipedia/commons/f/f0/Chess_kdt45.svg'
    }
};

const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playAudio(type) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    const now = audioCtx.currentTime;

    if (type === 'move') {
        osc.frequency.setValueAtTime(400, now);
        osc.frequency.exponentialRampToValueAtTime(180, now + 0.06);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
        osc.start(now); osc.stop(now + 0.06);
    } else if (type === 'capture') {
        osc.frequency.setValueAtTime(500, now);
        osc.frequency.exponentialRampToValueAtTime(140, now + 0.09);
        gain.gain.setValueAtTime(0.22, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
        osc.start(now); osc.stop(now + 0.09);
    } else if (type === 'check') {
        osc.frequency.setValueAtTime(750, now);
        osc.frequency.setValueAtTime(550, now + 0.07);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
        osc.start(now); osc.stop(now + 0.16);
    }
}

const game = new Chess();

let flipped = false;
let selectedSq = null;
let legalMoves = [];
let lastMove = [];
let isBusy = false;
let autoPlay = false;
let playerColor = 'w';
let pendingPromo = null;
let showArrow = true;

let isDragging = false;
let dragFrom = null;

let wSec = 300;
let bSec = 300;
let timeInc = 0;
let timerId = null;
let timerActive = false;

const boardEl = document.getElementById('board');
const dragFollower = document.getElementById('dragFollower');
const evalFill = document.getElementById('evalFill');
const evalTop = document.getElementById('evalTop');
const evalBottom = document.getElementById('evalBottom');
const openingTitle = document.getElementById('openingTitle');
const openingSub = document.getElementById('openingSub');
const statDepth = document.getElementById('statDepth');
const statNps = document.getElementById('statNps');
const statSource = document.getElementById('statSource');
const statEval = document.getElementById('statEval');
const statPv = document.getElementById('statPv');
const movesBody = document.getElementById('movesBody');
const movesWrap = document.getElementById('movesWrap');
const eloSlider = document.getElementById('eloSlider');
const eloLabel = document.getElementById('eloLabel');
const promoModal = document.getElementById('promoModal');
const promoList = document.getElementById('promoList');
const fenModal = document.getElementById('fenModal');
const fenText = document.getElementById('fenText');
const gameoverModal = document.getElementById('gameoverModal');
const goTitle = document.getElementById('goTitle');
const goDesc = document.getElementById('goDesc');
const moveArrow = document.getElementById('moveArrow');
const topClock = document.getElementById('topClock');
const bottomClock = document.getElementById('bottomClock');
const timeControlSelect = document.getElementById('timeControlSelect');
const themeSelect = document.getElementById('themeSelect');

function coordToSq(f, r) {
    return String.fromCharCode(97 + f) + (r + 1);
}

function fmtTime(sec) {
    if (sec <= 0) return "00:00";
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60);
    return `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
}

function startTimer() {
    if (timerId) clearInterval(timerId);
    if (timeControlSelect.value === 'none') {
        topClock.textContent = "--:--";
        bottomClock.textContent = "--:--";
        return;
    }

    timerActive = true;
    timerId = setInterval(() => {
        if (game.game_over()) {
            clearInterval(timerId);
            return;
        }

        if (game.turn() === 'w') {
            wSec = Math.max(0, wSec - 1);
            if (wSec === 0) onTimeout('w');
        } else {
            bSec = Math.max(0, bSec - 1);
            if (bSec === 0) onTimeout('b');
        }
        updateClocks();
    }, 1000);
}

function updateClocks() {
    if (timeControlSelect.value === 'none') return;
    const wStr = fmtTime(wSec);
    const bStr = fmtTime(bSec);

    if (!flipped) {
        topClock.textContent = bStr;
        bottomClock.textContent = wStr;
        topClock.classList.toggle('low', bSec <= 15);
        bottomClock.classList.toggle('low', wSec <= 15);
        topClock.classList.toggle('active', game.turn() === 'b');
        bottomClock.classList.toggle('active', game.turn() === 'w');
    } else {
        topClock.textContent = wStr;
        bottomClock.textContent = bStr;
        topClock.classList.toggle('low', wSec <= 15);
        bottomClock.classList.toggle('low', bSec <= 15);
        topClock.classList.toggle('active', game.turn() === 'w');
        bottomClock.classList.toggle('active', game.turn() === 'b');
    }
}

function onTimeout(side) {
    clearInterval(timerId);
    playAudio('check');
    const winner = side === 'w' ? "Black" : "White";
    goTitle.textContent = "Time Out";
    goDesc.textContent = `${winner} wins on time.`;
    gameoverModal.style.display = 'flex';
}

function renderBoard() {
    boardEl.innerHTML = '';
    const files = 'abcdefgh';
    let checkSq = null;

    if (game.in_check()) {
        const turn = game.turn();
        for (let r = 0; r < 8; r++) {
            for (let f = 0; f < 8; f++) {
                const sq = coordToSq(f, r);
                const p = game.get(sq);
                if (p && p.type === 'k' && p.color === turn) {
                    checkSq = sq;
                    break;
                }
            }
        }
    }

    for (let rIdx = 0; rIdx < 8; rIdx++) {
        for (let cIdx = 0; cIdx < 8; cIdx++) {
            const r = flipped ? rIdx : 7 - rIdx;
            const f = flipped ? 7 - cIdx : cIdx;
            const sq = coordToSq(f, r);
            const isLight = (f + r) % 2 !== 0;

            const div = document.createElement('div');
            div.className = `square ${isLight ? 'light' : 'dark'}`;
            div.dataset.sq = sq;

            if (selectedSq === sq) div.classList.add('selected');
            if (lastMove.includes(sq)) div.classList.add('last-move');
            if (checkSq === sq) div.classList.add('check');

            if ((!flipped && cIdx === 0) || (flipped && cIdx === 7)) {
                const lbl = document.createElement('span');
                lbl.className = 'coord rank';
                lbl.textContent = r + 1;
                div.appendChild(lbl);
            }
            if ((!flipped && rIdx === 7) || (flipped && rIdx === 0)) {
                const lbl = document.createElement('span');
                lbl.className = 'coord file';
                lbl.textContent = files[f];
                div.appendChild(lbl);
            }

            const p = game.get(sq);
            if (p) {
                const pieceDiv = document.createElement('div');
                pieceDiv.className = 'piece';
                pieceDiv.style.backgroundImage = `url('${PIECES[p.color][p.type]}')`;
                div.appendChild(pieceDiv);
            }

            const isLegal = legalMoves.find(m => m.to === sq);
            if (isLegal) {
                if (p || isLegal.flags.includes('e')) {
                    const ring = document.createElement('div');
                    ring.className = 'hint-ring';
                    div.appendChild(ring);
                } else {
                    const dot = document.createElement('div');
                    dot.className = 'hint-dot';
                    div.appendChild(dot);
                }
            }

            div.addEventListener('pointerdown', (e) => onSquareDown(e, sq));
            boardEl.appendChild(div);
        }
    }

    updateCaptured();
    updateClocks();
    checkGameOver();
}

function updateCaptured() {
    const full = { p: 8, n: 2, b: 2, r: 2, q: 1 };
    const cur = { w: { p:0,n:0,b:0,r:0,q:0 }, b: { p:0,n:0,b:0,r:0,q:0 } };

    const b = game.board();
    for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
            const p = b[r][c];
            if (p && p.type !== 'k') cur[p.color][p.type]++;
        }
    }

    const byW = [];
    const byB = [];
    let wVal = 0, bVal = 0;
    const vals = { p:1, n:3, b:3, r:5, q:9 };

    ['q','r','b','n','p'].forEach(t => {
        const wLoss = full[t] - cur['w'][t];
        const bLoss = full[t] - cur['b'][t];
        for (let i = 0; i < bLoss; i++) { byW.push({ color: 'b', type: t }); wVal += vals[t]; }
        for (let i = 0; i < wLoss; i++) { byB.push({ color: 'w', type: t }); bVal += vals[t]; }
    });

    const diff = wVal - bVal;

    function renderList(elId, list, adv) {
        const el = document.getElementById(elId);
        el.innerHTML = '';
        list.forEach(p => {
            const sp = document.createElement('div');
            sp.className = 'captured-img';
            sp.style.backgroundImage = `url('${PIECES[p.color][p.type]}')`;
            el.appendChild(sp);
        });
        if (adv > 0) {
            const ad = document.createElement('span');
            ad.className = 'mat-diff';
            ad.textContent = `+${adv}`;
            el.appendChild(ad);
        }
    }

    if (!flipped) {
        renderList('topCaptured', byB, diff < 0 ? -diff : 0);
        renderList('bottomCaptured', byW, diff > 0 ? diff : 0);
    } else {
        renderList('topCaptured', byW, diff > 0 ? diff : 0);
        renderList('bottomCaptured', byB, diff < 0 ? -diff : 0);
    }
}

function onSquareDown(e, sq) {
    if (isBusy && !autoPlay) return;
    if (game.game_over()) return;

    const p = game.get(sq);
    const turn = game.turn();
    const canMove = (autoPlay || turn === playerColor);

    if (selectedSq) {
        if (selectedSq === sq) {
            selectedSq = null;
            legalMoves = [];
            renderBoard();
            return;
        }

        const move = legalMoves.find(m => m.to === sq);
        if (move) {
            if (move.flags.includes('p')) {
                pendingPromo = { from: selectedSq, to: sq };
                showPromo(turn);
                return;
            }
            playMove(selectedSq, sq);
            selectedSq = null;
            legalMoves = [];
            return;
        }

        if (p && p.color === turn && canMove) {
            selectSq(sq);
            startDrag(e, sq, p);
            return;
        }

        selectedSq = null;
        legalMoves = [];
        renderBoard();
    } else {
        if (p && p.color === turn && canMove) {
            selectSq(sq);
            startDrag(e, sq, p);
        }
    }
}

function selectSq(sq) {
    selectedSq = sq;
    legalMoves = game.moves({ square: sq, verbose: true });
    renderBoard();
}

function startDrag(e, sq, p) {
    isDragging = true;
    dragFrom = sq;
    dragFollower.style.backgroundImage = `url('${PIECES[p.color][p.type]}')`;
    dragFollower.style.display = 'block';
    moveDrag(e);

    window.addEventListener('pointermove', onDragMove);
    window.addEventListener('pointerup', onDragUp);
}

function onDragMove(e) {
    if (isDragging) moveDrag(e);
}

function moveDrag(e) {
    dragFollower.style.left = e.clientX + 'px';
    dragFollower.style.top = e.clientY + 'px';
}

function onDragUp(e) {
    if (!isDragging) return;
    isDragging = false;
    dragFollower.style.display = 'none';

    window.removeEventListener('pointermove', onDragMove);
    window.removeEventListener('pointerup', onDragUp);

    const el = document.elementFromPoint(e.clientX, e.clientY);
    const sqDiv = el ? el.closest('.square') : null;

    if (sqDiv) {
        const targetSq = sqDiv.dataset.sq;
        if (targetSq && targetSq !== dragFrom) {
            const move = legalMoves.find(m => m.to === targetSq);
            if (move) {
                if (move.flags.includes('p')) {
                    pendingPromo = { from: dragFrom, to: targetSq };
                    showPromo(game.turn());
                    return;
                }
                playMove(dragFrom, targetSq);
                selectedSq = null;
                legalMoves = [];
                return;
            }
        }
    }
    renderBoard();
}

function playMove(from, to, promo = 'q') {
    const side = game.turn();
    const res = game.move({ from, to, promotion: promo });
    if (!res) return false;

    lastMove = [from, to];
    hideArrow();

    if (!timerActive) startTimer();
    if (side === 'w') wSec += timeInc;
    else bSec += timeInc;

    if (res.captured) playAudio('capture');
    else playAudio('move');
    if (game.in_check()) playAudio('check');

    renderBoard();
    updateTable();
    detectOpening();

    if (!game.game_over()) {
        triggerAi();
    }
    return true;
}

function showPromo(color) {
    promoList.innerHTML = '';
    ['q','r','b','n'].forEach(t => {
        const item = document.createElement('div');
        item.className = 'promo-item';
        item.style.backgroundImage = `url('${PIECES[color][t]}')`;
        item.onclick = () => {
            promoModal.style.display = 'none';
            if (pendingPromo) {
                playMove(pendingPromo.from, pendingPromo.to, t);
                pendingPromo = null;
                selectedSq = null;
                legalMoves = [];
            }
        };
        promoList.appendChild(item);
    });
    promoModal.style.display = 'flex';
}

function drawArrow(from, to) {
    if (!showArrow) {
        moveArrow.style.display = 'none';
        return;
    }
    const files = 'abcdefgh';
    const c1 = files.indexOf(from[0]);
    const r1 = parseInt(from[1]) - 1;
    const c2 = files.indexOf(to[0]);
    const r2 = parseInt(to[1]) - 1;

    const x1 = (flipped ? 7 - c1 : c1) * 70 + 35;
    const y1 = (flipped ? r1 : 7 - r1) * 70 + 35;
    const x2 = (flipped ? 7 - c2 : c2) * 70 + 35;
    const y2 = (flipped ? r2 : 7 - r2) * 70 + 35;

    moveArrow.setAttribute('x1', x1);
    moveArrow.setAttribute('y1', y1);
    moveArrow.setAttribute('x2', x2);
    moveArrow.setAttribute('y2', y2);
    moveArrow.style.display = 'block';
}

function hideArrow() {
    moveArrow.style.display = 'none';
}

async function triggerAi() {
    if (game.game_over()) return;
    isBusy = true;
    document.getElementById('engineStatusText').textContent = "Calculating...";

    const fen = game.fen();
    const elo = parseInt(eloSlider.value);
    const history = game.history({ verbose: true });
    const uciMoves = history.map(m => m.from + m.to + (m.promotion || ''));

    try {
        const resp = await fetch('/api/move', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                fen: fen,
                moves: uciMoves,
                elo: elo,
                use_cloud: elo >= 3500
            })
        });

        const data = await resp.json();
        isBusy = false;
        document.getElementById('engineStatusText').textContent = "Ready";

        if (data.best_move) {
            const bm = data.best_move;
            const from = bm.substring(0, 2);
            const to = bm.substring(2, 4);
            const promo = bm[4] || 'q';

            statDepth.textContent = data.depth || '70';
            statNps.textContent = data.nps ? (data.nps > 1000000 ? (data.nps / 1000000).toFixed(1) + "M" : (data.nps / 1000).toFixed(0) + "k") : "Cloud";
            statSource.textContent = data.source || "Engine";

            let cp = data.score_cp || 0;
            if (game.turn() === 'b') cp = -cp;
            updateEval(cp, data.mate);

            statPv.textContent = data.pv || bm;
            drawArrow(from, to);

            if (autoPlay || game.turn() !== playerColor) {
                setTimeout(() => {
                    playMove(from, to, promo);
                    if (autoPlay && !game.game_over()) {
                        setTimeout(triggerAi, 500);
                    }
                }, 200);
            }
        }
    } catch (err) {
        isBusy = false;
        document.getElementById('engineStatusText').textContent = "Engine Offline";
    }
}

function updateEval(cp, mate) {
    let text = '';
    let pct = 50;

    if (mate !== null && mate !== undefined) {
        text = `M${Math.abs(mate)}`;
        pct = mate > 0 ? 100 : 0;
    } else {
        const val = (cp / 100).toFixed(1);
        text = (cp > 0 ? '+' : '') + val;
        pct = 50 + 50 * (2 / (1 + Math.exp(-0.0035 * cp)) - 1);
        pct = Math.max(4, Math.min(96, pct));
    }

    evalFill.style.height = `${pct}%`;
    statEval.textContent = text;

    if (pct >= 50) {
        evalBottom.textContent = text;
        evalTop.textContent = '';
    } else {
        evalTop.textContent = text;
        evalBottom.textContent = '';
    }
}

function updateTable() {
    movesBody.innerHTML = '';
    const hist = game.history();

    for (let i = 0; i < hist.length; i += 2) {
        const num = Math.floor(i / 2) + 1;
        const w = hist[i];
        const b = hist[i + 1] || '';

        const tr = document.createElement('tr');
        tr.innerHTML = `<td class="col-num">${num}</td><td class="col-move">${w}</td><td class="col-move">${b}</td>`;
        movesBody.appendChild(tr);
    }
    movesWrap.scrollTop = movesWrap.scrollHeight;
}

function checkGameOver() {
    if (game.in_checkmate()) {
        if (timerId) clearInterval(timerId);
        playAudio('check');
        const winner = game.turn() === 'w' ? "Black" : "White";
        goTitle.textContent = "Checkmate";
        goDesc.textContent = `${winner} wins.`;
        gameoverModal.style.display = 'flex';
    } else if (game.in_draw()) {
        if (timerId) clearInterval(timerId);
        goTitle.textContent = "Draw";
        goDesc.textContent = "Game ended in a draw.";
        gameoverModal.style.display = 'flex';
    }
}

function detectOpening() {
    const hist = game.history({ verbose: true });
    if (hist.length === 0) {
        openingTitle.textContent = "Starting Position";
        openingSub.textContent = "ECO A00";
        return;
    }

    const moves = hist.map(m => m.from + m.to);
    const m0 = moves[0] || '';
    const m1 = moves[1] || '';
    const m2 = moves[2] || '';
    const m3 = moves[3] || '';
    const m4 = moves[4] || '';

    if (m0 === 'e2e4') {
        if (m1 === 'c7c5') {
            openingTitle.textContent = "Sicilian Defense";
            openingSub.textContent = (m2 === 'g1f3' && m3 === 'd7d6') ? "ECO B50 Open" : "ECO B20";
        } else if (m1 === 'e7e5') {
            if (m2 === 'g1f3' && m3 === 'b8c6') {
                if (m4 === 'f1b5') { openingTitle.textContent = "Ruy Lopez"; openingSub.textContent = "ECO C60"; }
                else if (m4 === 'f1c4') { openingTitle.textContent = "Italian Game"; openingSub.textContent = "ECO C50"; }
                else if (m4 === 'd2d4') { openingTitle.textContent = "Scotch Game"; openingSub.textContent = "ECO C45"; }
                else { openingTitle.textContent = "King's Knight"; openingSub.textContent = "ECO C40"; }
            } else {
                openingTitle.textContent = "Open Game";
                openingSub.textContent = "ECO C20";
            }
        } else if (m1 === 'e7e6') {
            openingTitle.textContent = "French Defense";
            openingSub.textContent = "ECO C00";
        } else if (m1 === 'c7c6') {
            openingTitle.textContent = "Caro-Kann Defense";
            openingSub.textContent = "ECO B10";
        } else if (m1 === 'd7d5') {
            openingTitle.textContent = "Scandinavian Defense";
            openingSub.textContent = "ECO B01";
        }
    } else if (m0 === 'd2d4') {
        if (m1 === 'd7d5') {
            if (m2 === 'c2c4') { openingTitle.textContent = "Queen's Gambit"; openingSub.textContent = "ECO D06"; }
            else if (m2 === 'c1f4') { openingTitle.textContent = "London System"; openingSub.textContent = "ECO D00"; }
        } else if (m1 === 'g8f6') {
            openingTitle.textContent = (m2 === 'c2c4' && m3 === 'g7g6') ? "King's Indian / Grunfeld" : "Indian Defense";
            openingSub.textContent = "ECO E60";
        }
    } else if (m0 === 'c2c4') {
        openingTitle.textContent = "English Opening";
        openingSub.textContent = "ECO A10";
    } else if (m0 === 'g1f3') {
        openingTitle.textContent = "Reti Opening";
        openingSub.textContent = "ECO A04";
    }
}

function resetClocks() {
    if (timerId) clearInterval(timerId);
    timerActive = false;

    const val = timeControlSelect.value;
    if (val === 'none') {
        wSec = 0; bSec = 0; timeInc = 0;
        topClock.textContent = "--:--";
        bottomClock.textContent = "--:--";
    } else {
        const parts = val.split('+');
        const base = parseInt(parts[0]);
        wSec = base; bSec = base;
        timeInc = parseInt(parts[1]);
        updateClocks();
    }
}

document.getElementById('btnNew').onclick = () => {
    game.reset();
    selectedSq = null;
    legalMoves = [];
    lastMove = [];
    autoPlay = false;
    document.getElementById('btnSelf').textContent = "Auto Play";
    hideArrow();
    resetClocks();
    renderBoard();
    updateTable();
    detectOpening();
    updateEval(0, null);
};

document.getElementById('btnRestart').onclick = () => {
    gameoverModal.style.display = 'none';
    document.getElementById('btnNew').click();
};

document.getElementById('btnFlip').onclick = () => {
    flipped = !flipped;
    playerColor = (playerColor === 'w') ? 'b' : 'w';
    document.getElementById('topPlayerName').textContent = flipped ? "Player (White)" : "Engine (Black)";
    document.getElementById('bottomPlayerName').textContent = flipped ? "Engine (Black)" : "Player (White)";
    renderBoard();
};

document.getElementById('btnUndo').onclick = () => {
    game.undo();
    if (!autoPlay && game.turn() !== playerColor) game.undo();
    selectedSq = null;
    legalMoves = [];
    lastMove = [];
    hideArrow();
    renderBoard();
    updateTable();
    detectOpening();
};

document.getElementById('btnSelf').onclick = () => {
    autoPlay = !autoPlay;
    document.getElementById('btnSelf').textContent = autoPlay ? "Pause" : "Auto Play";
    if (autoPlay && !game.game_over()) triggerAi();
};

document.getElementById('btnPgn').onclick = () => {
    const today = new Date().toISOString().slice(0, 10).replace(/-/g, '.');
    let pgn = `[Event "Casual Game"]\n[Site "Local"]\n[Date "${today}"]\n[White "${playerColor === 'w' ? 'Player' : 'Gravity'}"]\n[Black "${playerColor === 'b' ? 'Player' : 'Gravity'}"]\n\n`;
    pgn += game.pgn() || "*";

    const blob = new Blob([pgn], { type: 'text/plain' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `game_${today}.pgn`;
    a.click();
    URL.revokeObjectURL(url);
};

document.getElementById('btnFen').onclick = () => {
    navigator.clipboard.writeText(game.fen()).then(() => alert("FEN copied."));
};

document.getElementById('btnLoad').onclick = () => {
    fenText.value = game.fen();
    fenModal.style.display = 'flex';
};

document.getElementById('btnApplyFen').onclick = () => {
    const fen = fenText.value.trim();
    if (game.load(fen)) {
        fenModal.style.display = 'none';
        selectedSq = null;
        legalMoves = [];
        lastMove = [];
        hideArrow();
        renderBoard();
        updateTable();
        detectOpening();
    } else {
        alert("Invalid FEN.");
    }
};

document.getElementById('btnHint').onclick = () => {
    showArrow = !showArrow;
    if (!showArrow) hideArrow();
};

themeSelect.onchange = () => {
    document.body.className = '';
    if (themeSelect.value !== 'default') {
        document.body.classList.add(themeSelect.value);
    }
};

timeControlSelect.onchange = () => {
    resetClocks();
};

eloSlider.oninput = () => {
    eloLabel.textContent = eloSlider.value;
};

resetClocks();
renderBoard();
updateTable();
</script>

</body>
